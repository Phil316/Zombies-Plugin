name: Build Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Rename JAR
        run: |
          mkdir -p dist
          cp target/zombies-*.jar dist/Zombies-Deutsch-1.0.0.jar
          cp target/zombies-*.jar dist/zombies-1.0.0.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombies-plugin
          path: dist/*.jar

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-deutsch
          name: Zombies Deutsch v1.0.0
          body: |
            Deutsche Version von HypixelZombies (Phil316-Fork).
            - Deutsche Texte / Titel
            - Kein Death-Menü
            - Auto-Start optional beim Join
          files: |
            dist/Zombies-Deutsch-1.0.0.jar
            dist/zombies-1.0.0.jar
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
